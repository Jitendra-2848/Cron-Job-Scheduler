<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jobs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #222;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>Jobs</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>User ID</th>
                <th>Name</th>
                <th>URL</th>
                <th>Method</th>
                <th>Cron</th>
                <th>Payload</th>
                <th>Retries</th>
                <th>Status</th>
                <th>Created At</th>
            </tr>
        </thead>

        <tbody id="jobsTable">
        </tbody>
    </table>

    <script>
        async function loadJobs() {
            try {
                const response = await fetch("http://localhost:8000/data");

                if (!response.ok) {
                    throw new Error("Failed to fetch data");
                }

                const jobs = await response.json();

                const table = document.getElementById("jobsTable");

                jobs.forEach(job => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${job.id}</td>
                        <td>${job.user_id}</td>
                        <td>${job.name}</td>
                        <td>${job.url}</td>
                        <td>${job.method}</td>
                        <td>${job.cron_expression}</td>
                        <td>
                            <pre>${JSON.stringify(job.payload, null, 2)}</pre>
                        </td>
                        <td>${job.retries}</td>
                        <td>${job.status}</td>
                        <td>${new Date(job.created_at).toLocaleString()}</td>
                    `;

                    table.appendChild(row);
                });

            } catch (error) {
                console.error(error);
            }
        }

        loadJobs();
    </script>

</body>
</html>
